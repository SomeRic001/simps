{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Income - SIMPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl md:text-2xl font-bold text-indigo-600">SIMPS</h1>
                
                <div class="flex items-center space-x-6">
                    <a href="{% url 'dashboard_home' %}" class="text-gray-700 hover:text-indigo-600 transition font-medium">
                        Dashboard
                    </a>
                    <a href="#" class="text-gray-700 hover:text-indigo-600 transition font-medium">
                        Explore
                    </a>
                    <a href="#" class="text-gray-700 hover:text-indigo-600 transition font-medium">
                        Portfolio
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto px-4 py-8">
        
        <!-- Back Button -->
        <a href="{% url 'dashboard_home' %}" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 mb-6">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Dashboard
        </a>

        <!-- Page Title -->
        <div class="bg-white shadow-lg rounded-xl p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-6">Add Income</h1>
            
            <!-- Success/Error Message -->
            <div id="message" class="hidden mb-4 p-4 rounded-lg"></div>

            <!-- Income Form -->
            <form id="incomeForm" class="space-y-6">
                {% csrf_token %}
                
                <!-- Month -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Month <span class="text-red-500">*</span>
                    </label>
                    <select name="month" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">Select Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>

                <!-- Year -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Year <span class="text-red-500">*</span>
                    </label>
                    <input type="number" name="year" required 
                           min="2000" max="2100" value="2026"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="2026">
                </div>

                <!-- Amount -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Amount <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-gray-500 text-lg">$</span>
                        <input type="number" name="amount" required 
                               min="0" step="0.01"
                               class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                               placeholder="0.00">
                    </div>
                </div>

                <!-- Source -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Source <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="source" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                           placeholder="e.g., Salary, Freelance, Investment">
                </div>

                <!-- Submit Button -->
                <div class="flex gap-4">
                    <button type="submit" 
                            class="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-medium">
                        <i class="fas fa-plus mr-2"></i>
                        Add Income
                    </button>
                    <a href="{% url 'dashboard_home' %}" 
                       class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400 transition font-medium text-center">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('incomeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                user_id: 1,  // TODO: Get from logged-in user
                month: parseInt(formData.get('month')),
                year: parseInt(formData.get('year')),
                amount: parseFloat(formData.get('amount')),
                source: formData.get('source')
            };

            try {
                const response = await fetch('/dashboard/add-income/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const messageDiv = document.getElementById('message');
                
                if (result.status === 'success') {
                    messageDiv.className = 'mb-4 p-4 rounded-lg bg-green-100 text-green-700';
                    messageDiv.textContent = 'Income added successfully!';
                    messageDiv.classList.remove('hidden');
                    this.reset();
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '{% url "dashboard_home" %}';
                    }, 2000);
                } else {
                    messageDiv.className = 'mb-4 p-4 rounded-lg bg-red-100 text-red-700';
                    messageDiv.textContent = 'Error: ' + result.message;
                    messageDiv.classList.remove('hidden');
                }
            } catch (error) {
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'mb-4 p-4 rounded-lg bg-red-100 text-red-700';
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
